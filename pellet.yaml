esphome:
  # ESPHome node name (prefix used in Home Assistant entities)
  name: pellet

esp8266:
  # Target board
  board: d1_mini

# Serial logging for debugging
logger:

# Native ESPHome <-> Home Assistant API
api:
  encryption:
    # Paste here the API key generated by the wizard
    key: "YOUR_API_ENCRYPTION_KEY"

# OTA (Over-The-Air) firmware updates
ota:
  - platform: esphome

wifi:
  # Main Wi-Fi credentials
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  min_auth_mode: WPA2

  # Fallback hotspot if main Wi-Fi is unavailable
  ap:
    ssid: "Pellet Fallback Hotspot"
    password: "YOUR_FALLBACK_AP_PASSWORD"

# Captive portal for emergency setup
captive_portal:

i2c:
  # I2C bus used by the VL53L0X sensor
  sda: D2
  scl: D1
  # Scan I2C addresses at boot (useful for debugging)
  scan: true
  id: bus_a

sensor:
  # Time-of-Flight distance sensor (meters)
  - platform: vl53l0x
    id: distance_sensor
    name: "Pellet Distance"
    address: 0x29
    update_interval: 10s
    long_range: false

  # Virtual sensor: converts distance into pellet level percentage
  - platform: template
    id: level
    name: "Pellet Level"
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: |-
      // If the reading is invalid, return 0%
      if (isnan(id(distance_sensor).state)) return 0;
      // Linear conversion:
      // 0.80 m = 0% (empty tank)
      // 0.10 m = 100% (full tank)
      auto r = (id(distance_sensor).state - 0.8) * (100.0 - 0.0) / (0.1 - 0.8) + 0.0;
      // Clamp value between 0% and 100%
      if (r > 100) return 100;
      if (r < 0) return 0;
      return r;
